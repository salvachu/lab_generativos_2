[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchlab"
version = "0.1.0"
description = "Laboratorio reproducible de VAEs vectoriales y sketch completion"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "torch>=2.7,<3", "matplotlib>=3.9,<4",
  "scipy>=1.14,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
references = ["opencv-python-headless>=4.10,<6", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
